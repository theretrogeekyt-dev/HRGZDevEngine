name: Build & Release HRGZDevEngine DOOM

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  #--------------------------------------------------------------------------
  # 1. Native macOS Build (Metal + Cocoa + AudioToolbox)
  #--------------------------------------------------------------------------
  build-macos:
    name: macOS Native (Metal / Cocoa)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build macOS DOOM Executable
        run: |
          mkdir -p build/mac
          clang -O3 -fomit-frame-pointer -Wall -Wno-parentheses -Wno-unused-const-variable \
            -Wno-unused-but-set-variable -Wno-unused-variable -Wno-unknown-warning-option \
            -std=c99 \
            src/doom/*.c src/hal/common/*.c src/hal/mac/*.c src/hal/mac/*.m \
            -Isrc/doom -Isrc/hal/common \
            -framework Cocoa -framework Metal -framework QuartzCore \
            -framework GameController \
            -framework AudioToolbox -framework CoreFoundation -framework Carbon \
            -lm -o build/mac/doom_mac

      - name: Package DOOM.app Application Bundle
        run: |
          APP_DIR="build/mac/DOOM.app"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"
          cp build/mac/doom_mac "${APP_DIR}/Contents/MacOS/DOOM"
          chmod +x "${APP_DIR}/Contents/MacOS/DOOM"
          if [ -f "doom1.wad" ]; then
            cp "doom1.wad" "${APP_DIR}/Contents/Resources/doom1.wad"
          fi
          cat > "${APP_DIR}/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>DOOM</string>
              <key>CFBundleIdentifier</key>
              <string>com.hrgzdevengine.doom</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>DOOM</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.10</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          xattr -cr "${APP_DIR}"
          codesign --force --deep --sign - "${APP_DIR}"
          codesign --force --sign - build/mac/doom_mac

      - name: Create macOS Release Zip
        run: |
          cd build/mac
          zip -r -y -X ../../HRGZDevEngine-DOOM-macOS.zip DOOM.app doom_mac

      - name: Package HRGZDevEngine Studio (.dmg)
        run: |
          node studio/package_studio.js mac
          cp dist/HRGZDevEngine-Studio-macOS.dmg .

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRGZDevEngine-DOOM-macOS
          path: HRGZDevEngine-DOOM-macOS.zip

      - name: Upload macOS Studio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRGZDevEngine-Studio-macOS
          path: HRGZDevEngine-Studio-macOS.dmg

  #--------------------------------------------------------------------------
  # 2. Modern Windows Native Build (Win32 + OpenGL + WinMM)
  #--------------------------------------------------------------------------
  build-windows:
    name: Windows Native (Win32 / OpenGL)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: mingw-w64-x86_64-gcc zip

      - name: Build Windows DOOM Executable
        shell: msys2 {0}
        run: |
          mkdir -p build/win
          gcc -O3 -fomit-frame-pointer -Wall -Wno-parentheses -Wno-unused-const-variable \
            -Wno-unused-but-set-variable -Wno-unused-variable \
            -std=c99 \
            src/doom/*.c src/hal/common/*.c src/hal/win32/*.c \
            -Isrc/doom -Isrc/hal/common \
            -lgdi32 -lwinmm -lws2_32 -lopengl32 -lm -s \
            -o build/win/doom.exe
          if [ -f "doom1.wad" ]; then
            cp "doom1.wad" build/win/doom1.wad
          fi

      - name: Create Windows Release Zip
        shell: msys2 {0}
        run: |
          cd build/win
          zip -r ../../HRGZDevEngine-DOOM-Windows.zip doom.exe doom1.wad

      - name: Package HRGZDevEngine Studio (.exe)
        shell: msys2 {0}
        run: |
          node studio/package_studio.js win
          cp dist/HRGZDevEngine-Studio-Windows.zip .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRGZDevEngine-DOOM-Windows
          path: HRGZDevEngine-DOOM-Windows.zip

      - name: Upload Windows Studio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRGZDevEngine-Studio-Windows
          path: HRGZDevEngine-Studio-Windows.zip

  #--------------------------------------------------------------------------
  # 3. Linux Build & Automated Headless Playsim Test Suite
  #--------------------------------------------------------------------------
  test-and-verify:
    name: Linux & Headless Playsim Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev netpbm

      - name: Build Headless Test Runner
        run: |
          mkdir -p build/test
          gcc -O3 -fomit-frame-pointer -Wall -Wno-parentheses -Wno-unused-const-variable \
            -Wno-unused-but-set-variable -Wno-unused-variable \
            -std=c99 \
            src/doom/*.c src/hal/common/*.c src/hal/test/*.c \
            -Isrc/doom -Isrc/hal/common \
            -lm -o build/test/doom_test

      - name: Run E1M1 Playsim Frame Verification (150 Frames)
        run: |
          ./build/test/doom_test -iwad doom1.wad -warp 1 1 -testframes 150

      - name: Run Player Movement Playsim Verification (120 Frames)
        run: |
          ./build/test/doom_test -iwad doom1.wad -warp 1 1 -testframes 120 -testmove

      - name: Run In-Game Menu UI Playsim Verification (120 Frames)
        run: |
          ./build/test/doom_test -iwad doom1.wad -warp 1 1 -testframes 120 -testmenu

      - name: Run Gamepad Playsim Verification (120 Frames)
        run: |
          ./build/test/doom_test -iwad doom1.wad -warp 1 1 -testframes 120 -testgamepad

      - name: Run Display Options Resolution Verification (100 Frames)
        run: |
          ./build/test/doom_test -iwad doom1.wad -warp 1 1 -testframes 100 -testdispmenu

      - name: Build Linux SDL2 DOOM Executable
        run: |
          mkdir -p build/linux
          gcc -O3 -fomit-frame-pointer -Wall -Wno-parentheses -Wno-unused-const-variable \
            -Wno-unused-but-set-variable -Wno-unused-variable \
            -std=c99 \
            src/doom/*.c src/hal/common/*.c src/hal/sdl/*.c \
            -Isrc/doom -Isrc/hal/common \
            -lSDL2 -lm -s -o build/linux/doom_sdl
          if [ -f "doom1.wad" ]; then
            cp "doom1.wad" build/linux/doom1.wad
          fi
          cd build/linux
          zip -r ../../HRGZDevEngine-DOOM-Linux-SDL2.zip doom_sdl doom1.wad

      - name: Convert Verification PPM Screenshots to PNG
        run: |
          mkdir -p build/test_results
          for ppm in test_*.ppm; do
            if [ -f "$ppm" ]; then
              pnmtopng "$ppm" > "build/test_results/${ppm%.ppm}.png"
            fi
          done

      - name: Upload Linux SDL2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRGZDevEngine-DOOM-Linux-SDL2
          path: HRGZDevEngine-DOOM-Linux-SDL2.zip

      - name: Package HRGZDevEngine Studio (.deb)
        run: |
          node studio/package_studio.js linux
          cp dist/hrgzdevengine-studio_1.0.0_all.deb .

      - name: Upload Linux Studio (.deb) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrgzdevengine-studio-deb
          path: hrgzdevengine-studio_1.0.0_all.deb

      - name: Upload Verification Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Verification-Screenshots
          path: build/test_results/

  #--------------------------------------------------------------------------
  # 4. Sony PlayStation Portable (PSP) Build (PSPDEV SDK Docker)
  #--------------------------------------------------------------------------
  build-psp:
    name: PlayStation Portable (PSP EBOOT.PBP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true

      - name: Build PSP EBOOT.PBP
        run: |
          IMAGE="ghcr.io/pspdev/pspdev:latest"
          if ! docker pull "$IMAGE"; then
            echo "GHCR pull failed, attempting Docker Hub..."
            IMAGE="pspdev/pspdev:latest"
          fi
          docker run --rm -v "${{ github.workspace }}:/src" -w /src "$IMAGE" make -f Makefile.psp
          sudo chown -R $USER:$USER .

      - name: Package PSP Release ZIP
        run: |
          mkdir -p build/psp/HRGZDOOM
          cp EBOOT.PBP build/psp/HRGZDOOM/
          if [ -f "doom1.wad" ]; then
            cp "doom1.wad" build/psp/HRGZDOOM/
          fi
          cd build/psp
          zip -r -y -X ../../HRGZDevEngine-DOOM-PSP.zip HRGZDOOM

      - name: Upload PSP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRGZDevEngine-DOOM-PSP
          path: HRGZDevEngine-DOOM-PSP.zip

  #--------------------------------------------------------------------------
  # 5. Automated GitHub Release Packaging & Changelog
  #--------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, test-and-verify, build-psp]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS Studio Artifact
        uses: actions/download-artifact@v4
        with:
          name: HRGZDevEngine-Studio-macOS

      - name: Download Windows Studio Artifact
        uses: actions/download-artifact@v4
        with:
          name: HRGZDevEngine-Studio-Windows

      - name: Download Linux Studio Artifact
        uses: actions/download-artifact@v4
        with:
          name: hrgzdevengine-studio-deb

      - name: Generate Release Notes & Changelog
        run: |
          # Generate unique version starting with prefix 0.0.1
          if [[ "${{ github.ref }}" == refs/tags/0.0.1* ]] || [[ "${{ github.ref }}" == refs/tags/v0.0.1* ]]; then
            VER="${{ github.ref_name }}"
          else
            VER="0.0.1.${{ github.run_number }}"
          fi

          COMMIT_SHORT=$(git rev-parse --short HEAD)
          TITLE="HRGZDevEngine Studio ${VER} (${COMMIT_SHORT})"

          echo "RELEASE_TAG=$VER" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$TITLE" >> $GITHUB_ENV

          cat << 'EOF' > release_notes.md
          # HRGZDevEngine Studio — Release

          ### 🚀 Official Studio Distribution Packages
          The All-in-One Game Creation, Compilation & Distribution System powered by the DOOM engine.

          | Platform | Package | Format | Description |
          |---|---|---|---|
          | 🍏 **macOS** | [`HRGZDevEngine-Studio-macOS.dmg`](https://github.com/${{ github.repository }}/releases/download/latest/HRGZDevEngine-Studio-macOS.dmg) | Apple Disk Image (`.dmg`) | Standalone Cocoa/WebKit Desktop App |
          | 🪟 **Windows** | [`HRGZDevEngine-Studio-Windows.zip`](https://github.com/${{ github.repository }}/releases/download/latest/HRGZDevEngine-Studio-Windows.zip) | Executable Bundle (`.exe`) | Standalone Win32 GUI (`HRGZDevEngine-Studio.exe`) |
          | 🐧 **Linux** | [`hrgzdevengine-studio_1.0.0_all.deb`](https://github.com/${{ github.repository }}/releases/download/latest/hrgzdevengine-studio_1.0.0_all.deb) | Debian Package (`.deb`) | Native `.desktop` entry & system CLI |

          ---

          ### ✨ Key Studio Features
          - **All-in-One Distribution Hub**: Dedicated desktop app to design, compile, and distribute standalone retro games powered by the DOOM engine.
          - **One-Click Native Export**: Packages your custom games directly into macOS Apple Disk Images (`.dmg`), Windows standalone executables (`.exe`), and Linux Debian packages (`.deb`).
          - **Integrated Asset Pipeline**: Instant WAD analysis, lump inspection, texture validation, and sound/music indexing.
          - **Multi-Resolution Presentation**: True 16:9 widescreen rendering, dynamic scaling (720p, 1080p, 1440p, 4K, 480p), and tear-free vertical sync.
          - **Zero External Runtime Dependencies**: Standalone game packages run out-of-the-box on macOS (Metal), Windows (OpenGL/Win32), and Linux (SDL2).
          - **Distribution-Ready**: Generates `itch.toml` action files and Steam configs for immediate publishing.

          ---

          ### 📝 Changelog
          #### Commits in this Build:
          EOF

          echo "" >> release_notes.md
          git log -n 12 --pretty=format:"- **%s** ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges >> release_notes.md
          echo "" >> release_notes.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: release_notes.md
          files: |
            HRGZDevEngine-Studio-macOS.dmg
            HRGZDevEngine-Studio-Windows.zip
            hrgzdevengine-studio_1.0.0_all.deb
          draft: false
          prerelease: false
          make_latest: true
