name: Build & Release HRGZDevEngine DOOM

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  #--------------------------------------------------------------------------
  # 1. Native macOS Build (Metal + Cocoa + AudioToolbox)
  #--------------------------------------------------------------------------
  build-macos:
    name: macOS Native (Metal / Cocoa)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build macOS DOOM Executable
        run: |
          mkdir -p build/mac
          clang -O2 -Wall -Wno-parentheses -Wno-unused-const-variable \
            -Wno-unused-but-set-variable -Wno-unused-variable -Wno-unknown-warning-option \
            -std=c99 \
            src/doom/*.c src/hal/common/*.c src/hal/mac/*.c src/hal/mac/*.m \
            -Isrc/doom -Isrc/hal/common \
            -framework Cocoa -framework Metal -framework QuartzCore \
            -framework GameController \
            -framework AudioToolbox -framework CoreFoundation -framework Carbon \
            -lm -o build/mac/doom_mac

      - name: Package DOOM.app Application Bundle
        run: |
          APP_DIR="build/mac/DOOM.app"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"
          cp build/mac/doom_mac "${APP_DIR}/Contents/MacOS/DOOM"
          chmod +x "${APP_DIR}/Contents/MacOS/DOOM"
          if [ -f "doom1.wad" ]; then
            cp "doom1.wad" "${APP_DIR}/Contents/Resources/doom1.wad"
          fi
          cat > "${APP_DIR}/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>DOOM</string>
              <key>CFBundleIdentifier</key>
              <string>com.hrgzdevengine.doom</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>DOOM</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.10</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          xattr -cr "${APP_DIR}"
          codesign --force --deep --sign - "${APP_DIR}"
          codesign --force --sign - build/mac/doom_mac

      - name: Create macOS Release Zip
        run: |
          cd build/mac
          zip -r -y -X ../../HRGZDevEngine-DOOM-macOS.zip DOOM.app doom_mac

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRGZDevEngine-DOOM-macOS
          path: HRGZDevEngine-DOOM-macOS.zip

  #--------------------------------------------------------------------------
  # 2. Modern Windows Native Build (Win32 + OpenGL + WinMM)
  #--------------------------------------------------------------------------
  build-windows:
    name: Windows Native (Win32 / OpenGL)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc zip

      - name: Build Windows DOOM Executable
        shell: msys2 {0}
        run: |
          mkdir -p build/win
          gcc -O2 -Wall -Wno-parentheses -Wno-unused-const-variable \
            -Wno-unused-but-set-variable -Wno-unused-variable \
            -std=c99 \
            src/doom/*.c src/hal/common/*.c src/hal/win32/*.c \
            -Isrc/doom -Isrc/hal/common \
            -lgdi32 -lwinmm -lws2_32 -lopengl32 -lm -s \
            -o build/win/doom.exe
          if [ -f "doom1.wad" ]; then
            cp "doom1.wad" build/win/doom1.wad
          fi

      - name: Create Windows Release Zip
        shell: msys2 {0}
        run: |
          cd build/win
          zip -r ../../HRGZDevEngine-DOOM-Windows.zip doom.exe doom1.wad

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRGZDevEngine-DOOM-Windows
          path: HRGZDevEngine-DOOM-Windows.zip

  #--------------------------------------------------------------------------
  # 3. Linux Build & Automated Headless Playsim Test Suite
  #--------------------------------------------------------------------------
  test-and-verify:
    name: Linux & Headless Playsim Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev netpbm

      - name: Build Headless Test Runner
        run: |
          mkdir -p build/test
          gcc -O2 -Wall -Wno-parentheses -Wno-unused-const-variable \
            -Wno-unused-but-set-variable -Wno-unused-variable \
            -std=c99 \
            src/doom/*.c src/hal/common/*.c src/hal/test/*.c \
            -Isrc/doom -Isrc/hal/common \
            -lm -o build/test/doom_test

      - name: Run E1M1 Playsim Frame Verification (150 Frames)
        run: |
          ./build/test/doom_test -iwad doom1.wad -warp 1 1 -testframes 150

      - name: Run Player Movement Playsim Verification (120 Frames)
        run: |
          ./build/test/doom_test -iwad doom1.wad -warp 1 1 -testframes 120 -testmove

      - name: Run In-Game Menu UI Playsim Verification (120 Frames)
        run: |
          ./build/test/doom_test -iwad doom1.wad -warp 1 1 -testframes 120 -testmenu

      - name: Run Gamepad Playsim Verification (120 Frames)
        run: |
          ./build/test/doom_test -iwad doom1.wad -warp 1 1 -testframes 120 -testgamepad

      - name: Build Linux SDL2 DOOM Executable
        run: |
          mkdir -p build/linux
          gcc -O2 -Wall -Wno-parentheses -Wno-unused-const-variable \
            -Wno-unused-but-set-variable -Wno-unused-variable \
            -std=c99 \
            src/doom/*.c src/hal/common/*.c src/hal/sdl/*.c \
            -Isrc/doom -Isrc/hal/common \
            -lSDL2 -lm -s -o build/linux/doom_sdl
          if [ -f "doom1.wad" ]; then
            cp "doom1.wad" build/linux/doom1.wad
          fi
          cd build/linux
          zip -r ../../HRGZDevEngine-DOOM-Linux-SDL2.zip doom_sdl doom1.wad

      - name: Convert Verification PPM Screenshots to PNG
        run: |
          mkdir -p build/test_results
          for ppm in test_*.ppm; do
            if [ -f "$ppm" ]; then
              pnmtopng "$ppm" > "build/test_results/${ppm%.ppm}.png"
            fi
          done

      - name: Upload Linux SDL2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRGZDevEngine-DOOM-Linux-SDL2
          path: HRGZDevEngine-DOOM-Linux-SDL2.zip

      - name: Upload Verification Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Verification-Screenshots
          path: build/test_results/

  #--------------------------------------------------------------------------
  # 4. Xbox 360 Homebrew Package (Peer Pressure Softmod via XeLL)
  #--------------------------------------------------------------------------
  build-xbox360:
    name: Xbox 360 Homebrew (Peer Pressure / XeLL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PowerPC Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-powerpc-linux-gnu libc6-dev-powerpc-cross binutils-powerpc-linux-gnu

      - name: Run Host Verification Test on Xbox 360 HAL
        run: |
          mkdir -p build/xenon
          gcc -O2 -Wall -Wno-parentheses -Wno-unused-const-variable \
            -Wno-unused-but-set-variable -Wno-unused-variable \
            -std=c99 \
            src/doom/*.c src/hal/common/*.c src/hal/xenon/*.c \
            -Isrc/doom -Isrc/hal/common \
            -lm -s -o build/xenon/doom_xenon_host

          # Run 30-frame verification test
          ./build/xenon/doom_xenon_host -iwad doom1.wad -warp 1 1 -testframes 30

      - name: Cross-Compile Native PowerPC XeLL ELF (xenon.elf)
        run: |
          # Compile true 32-bit Big-Endian PowerPC executable for Xbox 360 XeLL
          powerpc-linux-gnu-gcc -O2 -mcpu=powerpc -m32 -mbig-endian \
            -Wall -Wno-parentheses -Wno-unused-const-variable \
            -Wno-unused-but-set-variable -Wno-unused-variable \
            -std=c99 -DLIBXENON -D__BIG_ENDIAN__ \
            src/doom/*.c src/hal/common/*.c src/hal/xenon/*.c \
            -Isrc/doom -Isrc/hal/common \
            -lm -s -o build/xenon/xenon.elf

          file build/xenon/xenon.elf

      - name: Package Xbox 360 Release Zip
        run: |
          cp src/hal/xenon/README_XBOX360.txt build/xenon/README_XBOX360.txt
          cp src/hal/xenon/Makefile.xenon build/xenon/Makefile.xenon
          cp doom1.wad build/xenon/doom1.wad

          cd build/xenon
          zip -r ../../HRGZDevEngine-DOOM-Xbox360.zip xenon.elf doom1.wad README_XBOX360.txt Makefile.xenon

      - name: Upload Xbox 360 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRGZDevEngine-DOOM-Xbox360
          path: HRGZDevEngine-DOOM-Xbox360.zip

  #--------------------------------------------------------------------------
  # 5. Automated GitHub Release Packaging & Changelog
  #--------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, test-and-verify, build-xbox360]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: HRGZDevEngine-DOOM-macOS

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: HRGZDevEngine-DOOM-Windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: HRGZDevEngine-DOOM-Linux-SDL2

      - name: Download Xbox 360 Artifact
        uses: actions/download-artifact@v4
        with:
          name: HRGZDevEngine-DOOM-Xbox360

      - name: Generate Release Notes & Changelog
        run: |
          # Generate unique version starting with prefix 0.0.1
          if [[ "${{ github.ref }}" == refs/tags/0.0.1* ]] || [[ "${{ github.ref }}" == refs/tags/v0.0.1* ]]; then
            VER="${{ github.ref_name }}"
          else
            VER="0.0.1.${{ github.run_number }}"
          fi

          COMMIT_SHORT=$(git rev-parse --short HEAD)
          TITLE="0.0.1.${{ github.run_number }} - Update (${COMMIT_SHORT})"

          echo "RELEASE_TAG=$VER" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$TITLE" >> $GITHUB_ENV

          cat << 'EOF' > release_notes.md
          # HRGZDevEngine DOOM — Release

          ### 📦 Platform Downloads
          | Platform | Package | Driver Stack |
          |---|---|---|
          | 🍏 **macOS** | [`HRGZDevEngine-DOOM-macOS.zip`](https://github.com/${{ github.repository }}/releases/download/latest/HRGZDevEngine-DOOM-macOS.zip) | Metal HW Accel + Cocoa + AudioToolbox |
          | 🪟 **Windows** | [`HRGZDevEngine-DOOM-Windows.zip`](https://github.com/${{ github.repository }}/releases/download/latest/HRGZDevEngine-DOOM-Windows.zip) | Win32 + OpenGL HW Accel + WinMM + Winsock2 |
          | 🐧 **Linux** | [`HRGZDevEngine-DOOM-Linux-SDL2.zip`](https://github.com/${{ github.repository }}/releases/download/latest/HRGZDevEngine-DOOM-Linux-SDL2.zip) | SDL2 Driver + Software Audio Mixer |
          | 🎮 **Xbox 360** | [`HRGZDevEngine-DOOM-Xbox360.zip`](https://github.com/${{ github.repository }}/releases/download/latest/HRGZDevEngine-DOOM-Xbox360.zip) | "Peer Pressure" Softmod (XeLL 720p 16:9 PowerPC ELF) |

          ---

          ### 📝 Changelog
          #### Commits in this Build:
          EOF

          echo "" >> release_notes.md
          git log -n 12 --pretty=format:"- **%s** ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges >> release_notes.md
          echo "" >> release_notes.md

          cat << 'EOF' >> release_notes.md

          ---

          ### ✨ Key Features
          - **Hardware-Accelerated Rendering**: Native Apple Metal (macOS) and OpenGL (Windows) streaming presentation
          - **Xbox 360 Homebrew Support**: Dedicated HAL for Grimdoomer's "Peer Pressure" persistent softmod exploit & XeLL
          - **16:9 True Widescreen**: 426x200 sub-pixel resolution scaled to 720p with extended horizontal field of view
          - **Frame Refresh & Clearing System**: Double-buffered frame clearing and tear-free vertical sync
          - **Integrated IP Multiplayer**: UDP lobby system, peer-to-peer matchmaking, and in-game server hosting
          - **Automated Validation**: Regression-tested against canonical E1M1 playsim frame suites
          EOF

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: release_notes.md
          files: |
            HRGZDevEngine-DOOM-macOS.zip
            HRGZDevEngine-DOOM-Windows.zip
            HRGZDevEngine-DOOM-Linux-SDL2.zip
            HRGZDevEngine-DOOM-Xbox360.zip
          draft: false
          prerelease: false
          make_latest: true



